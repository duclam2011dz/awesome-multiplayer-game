<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Battle Eagle - Game</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            height: 100%;
            width: 100%;
        }

        canvas {
            display: block;
            background-color: #111;
        }

        .leaderboard {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: sans-serif;
            font-size: 14px;
            max-width: 200px;
            z-index: 999;
        }

        .leaderboard h3 {
            margin: 0 0 5px 0;
            font-size: 16px;
            text-align: center;
        }

        .leaderboard li {
            list-style: none;
            padding: 4px 0;
        }

        .gold {
            color: gold;
            font-weight: bold;
        }

        .silver {
            color: silver;
            font-weight: bold;
        }

        .copper {
            color: #cd7f32;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <canvas id="gameCanvas"></canvas>

    <div id="leaderboard" class="leaderboard">
        <h3>Bảng Xếp Hạng</h3>
        <ul id="leaderboard-list"></ul>
    </div>

    <div id="game-over"
        style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); display:flex; flex-direction:column; justify-content:center; align-items:center; z-index:10; color:white;">
        <h1>GAME OVER</h1>
        <button onclick="goMenu()" style="margin:10px; padding:10px 20px;">Menu</button>
        <button onclick="replayGame()" style="margin:10px; padding:10px 20px;">Replay</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>

</html>
